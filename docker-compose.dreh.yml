# Das Dashboard EIN ZWEITES MAL — als Drehkulisse, neben dem Betrieb.
#
# WARUM (21.08.2026): Waehrend der Anzeigen-Aufnahmen soll das Dashboard auf der
# Drehdatenbank laufen (erfundene Kunden, erfundene Zahlen). Gleichzeitig wird
# am echten System weitergearbeitet. Beides in EINEM Container heisst: Jeder
# Deploy stellt die Umgebung des jeweils anderen um. Genau das ist heute zweimal
# passiert — mitten im Aufbau stand das Dashboard wieder auf echten Kundennamen,
# und die Dreh-Konten konnten sich nicht mehr anmelden.
#
# Also zwei Container:
#
#   flowstate-dashboard   flowstate.srv1044804.hstgr.cloud   echte Daten
#   flowstate-dreh        dreh.srv1044804.hstgr.cloud        Kulisse
#
# Der Betrieb wird deployt wie immer. Die Kulisse mit ./dreh.sh. Keiner der
# beiden Befehle fasst den anderen Container an.
#
# AUFRUF (macht ./dreh.sh):
#   docker compose -p flowstate-dreh --env-file .env.dreh \
#     -f docker-compose.yml -f docker-compose.dreh.yml up -d --build dashboard
#
# Das -p ist wesentlich: Ein eigener Projektname gibt eigene Volumes, also eine
# eigene Sitzungsablage. Sonst teilten sich beide Seiten die Anmeldungen, und
# eine Anmeldung an der Kulisse wuerde im Betrieb weitergelten.
services:
  dashboard:
    container_name: flowstate-dreh
    environment:
      # Die Bruecke laeuft nur EINMAL, im Betriebsprojekt. Ein zweite braeuchte
      # eine eigene QR-Kopplung, und WhatsApp erlaubt keine zwei Sitzungen fuer
      # dasselbe Geraet. Die Kulisse spricht darum ueber das gemeinsame
      # Docker-Netz mit derselben Bruecke — im Dreh geht so eine echte
      # Nachricht in die Teamgruppe, und genau das soll man ja sehen.
      - WA_BRIDGE_URL=http://flowstate-whatsapp:3100
    volumes:
      # Das /wa-Volume gehoert dem Betriebsprojekt. Ohne diesen Eintrag legte
      # Compose ein zweites, leeres an — und die Kulisse haette keine Chats.
      - flowstate-dashboard_wa-state:/wa
    ports:
      # 8090 gehoert dem Betrieb. Zwei Container auf demselben Port starten
      # nicht — der zweite bliebe stumm liegen.
      - "8091:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.flowstatedreh.rule=Host(`dreh.srv1044804.hstgr.cloud`)
      - traefik.http.routers.flowstatedreh.entrypoints=websecure
      - traefik.http.routers.flowstatedreh.tls.certresolver=letsencrypt
      - traefik.http.services.flowstatedreh.loadbalancer.server.port=3000
    networks:
      - default
      - hermes
      - betrieb

  # Die Bruecke des Betriebsprojekts wird NICHT mitgestartet. Compose verlangt
  # trotzdem eine Beschreibung, weil sie in der Hauptdatei steht — hier auf ein
  # Bild ohne Aufgabe gesetzt und mit Profil versehen, damit sie nie hochkommt.
  whatsapp:
    profiles: ["nie"]

networks:
  # Das Netz des Betriebsprojekts, damit die Kulisse die WhatsApp-Bruecke
  # erreicht. Es heisst so, weil Compose Netze mit dem Projektnamen praefixt.
  betrieb:
    external: true
    name: flowstate-dashboard_default

volumes:
  flowstate-dashboard_wa-state:
    external: true
