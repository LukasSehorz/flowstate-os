# flowstate-dashboard — laeuft auf dem VPS neben Hermes, hinter Traefik (HTTPS)
# Label-Muster identisch zum funktionierenden Hermes-Setup (Hostinger: websecure + letsencrypt)
# Deploy: docker compose up -d --build
services:
  dashboard:
    build: .
    container_name: flowstate-dashboard
    restart: unless-stopped
    environment:
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - VAULT_PATH=/vault
      - DATA_PATH=/data
      - GWS_ENCRYPTION=none
      # gws-cli nutzt das gemountete Token-Verzeichnis (HOME zeigt auf /gws-home)
      - HOME=/gws-home
      # Hermes API-Server (OpenAI-kompatibel) — Chat mit Alexandra im Dashboard
      - HERMES_CHAT_URL=${HERMES_CHAT_URL}
      - HERMES_API_KEY=${HERMES_API_KEY}
      - HERMES_MODEL=hermes-agent
      # Streaming von Hermes: AUS (Messung 24.07.). Hermes denkt stumm und
      # liefert die fertige Antwort am Stueck — es gibt keinen Fortschritt zu
      # erzaehlen, und laenger denkende Aufgaben wurden von der Probezeit
      # abgebrochen und doppelt ausgefuehrt. Auf "an" setzen, sobald Hermes
      # echte Zwischenstaende liefert.
      - HERMES_STREAM=${HERMES_STREAM:-aus}
      # Schnellspur (Ebene 1/2) — direktes Modell ohne Agent-Schleife.
      # E1-Entscheidung 21.07.2026: Anthropic Haiku 4.5. Ohne Schluessel
      # faellt alles auf Hermes zurueck (langsamer, aber nie kaputt).
      - SCHNELL_PROVIDER=${SCHNELL_PROVIDER:-}
      - SCHNELL_API_KEY=${SCHNELL_API_KEY:-}
      - SCHNELL_MODEL=${SCHNELL_MODEL:-claude-haiku-4-5}
      - SCHNELL_CHAT_URL=${SCHNELL_CHAT_URL:-}
      # Denk-Spur (Ebene 2b) — Sonnet mit Websuche fuer kurze Recherche/
      # Auswertung (Wetter, Zahlen), unabhaengig von Hermes. STANDORT_ORT dient
      # als Wetter-Vorgabe, wenn keine Stadt genannt wird.
      - SCHNELL_DENKER_MODEL=${SCHNELL_DENKER_MODEL:-claude-sonnet-5}
      # Verstehen der Sprachbefehle (Entscheidung 24.07.): Sonnet statt Haiku,
      # der schwerste Schritt bekommt das staerkste Modell. Blitz-Zusage bleibt
      # Haiku. Faellt Sonnet aus, faengt Haiku als Reserve auf.
      - SPRACHE_VERSTEHEN_MODEL=${SPRACHE_VERSTEHEN_MODEL:-claude-sonnet-5}
      # Sprachprotokoll: Tagesdateien unter /data/sprachlog/ (Aufbewahrung Tage).
      - SPRACHLOG_TAGE=${SPRACHLOG_TAGE:-30}
      - STANDORT_ORT=${STANDORT_ORT:-Dorfen, Bayern}
      # Schnelles Nachschlagen (Phase 4, 25.07.): Serper liefert echte
      # Google-Treffer ueber einen legitimen Anbieter — ein Abruf, unter einer
      # Sekunde. Ohne Schluessel wird Wikipedia genutzt (gratis, aber schwach
      # bei Aktuellem); hilft auch das nicht, geht es an die gruendliche Suche.
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # Computer Use (20.08.2026, lib/computer.js): ein echter Browser fuer die
      # Flugsuche. Der Pfad kommt aus dem Dockerfile; das Budget begrenzt, wie
      # lange der Abruf hoechstens laufen darf. Gemessen am 20.08.: Google
      # Fluege braucht rund 20 s bis zu den Preisen, mit abgeschalteten Bildern
      # und Stylesheets; der ganze Vorgang 31 s. Der Chat wartet 45 s auf kurze
      # Auftraege — 32 s Budget lassen genug Rand, dass die Antwort noch im
      # Gespraech ankommt statt als Nachzuegler.
      - CHROME_PFAD=${CHROME_PFAD:-/usr/bin/chromium}
      - COMPUTER_BUDGET_MS=${COMPUTER_BUDGET_MS:-32000}
      - COMPUTER_MODEL=${COMPUTER_MODEL:-claude-haiku-4-5}
      # Wie weit der Kalender im STAND nach vorn reicht (Stufe 3, 25.07.):
      # 14 Tage waren zu knapp — "was steht in drei Wochen an?" lief ins Leere.
      - KALENDER_TAGE=${KALENDER_TAGE:-35}
      # Welcher Google-Kalender gelesen und beschrieben wird. Leer = der
      # Hauptkalender, also unveraendert. Nur fuer die Werbeaufnahmen zeigt das
      # auf einen zweiten Kalender desselben Kontos (siehe docs/dreh-umgebung.md).
      - KALENDER_ID=${KALENDER_ID:-}
      # Monatsziel im CRM-Dashboard. Leer = 30.000 wie bisher.
      - UMSATZ_ZIEL=${UMSATZ_ZIEL:-}
      # Regie-Seite fuer die Werbeaufnahmen (/regie). Ohne die 1 existiert die
      # Route nicht. Die Stimmen und Dokumente liegen im Ordner darunter.
      - DREH_REGIE=${DREH_REGIE:-}
      - DREH_ORDNER=/dreh
      # Wie der Agent in der Oberflaeche heisst. Leer = Alexandra.
      - AGENT_NAME=${AGENT_NAME:-}
      # Welches Creative im Drehbuch-Modus laeuft (0-3). Leer = kein Drehbuch,
      # der Agent antwortet dann wie immer selbst.
      - DREH_CREATIVE=${DREH_CREATIVE:-}
      # Abstand zwischen zwei Saetzen der Erzaehlspur, in Millisekunden.
      - ERZAEHL_ABSTAND_MS=${ERZAEHL_ABSTAND_MS:-5000}
      # WhatsApp-Bruecke (eigener Container). Das Dashboard zeigt die Koppelseite
      # und holt eingehende Nachrichten aus dem gemeinsamen /wa-Volume.
      - WA_DIR=/wa
      - WA_BRIDGE_URL=http://whatsapp:3100
      - WA_BRIDGE_SECRET=${WA_BRIDGE_SECRET:-}
      # Wer per WhatsApp ohne Rueckfrage angeschrieben werden darf (Namen aus
      # deinen Kontakten). Nummer kommt automatisch aus WhatsApp.
      - INTERN_WA_NAMEN=${INTERN_WA_NAMEN:-jannik}
      # In WELCHE WhatsApp-Gruppen Alexandra schreiben darf (Namen exakt wie in
      # WhatsApp, mit Komma getrennt). Freigabeliste statt Verbotsliste: was hier
      # nicht steht, existiert fuer sie nicht — private Gruppen sind damit von
      # vornherein aussen vor. Leer = gar keine Gruppen. Entscheidung Lukas 24.07.
      - WA_GRUPPEN=${WA_GRUPPEN:-}
      # Rechnungs- und Angebotsvorlagen aus Lukas' Bestand (nur lesend).
      - VORLAGEN_PFAD=/vorlagen
      # Ausweis fuer ElevenLabs. Der Telefon-Endpunkt steht offen im Netz und
      # kann WhatsApp verschicken und Rechnungen anlegen.
      #
      # Diese vier Zeilen standen bis 20.08. NUR auf dem Server und nie im
      # Repo. Aufgefallen ist es, als ein Deploy abbrach: "Please commit your
      # changes" — git weigerte sich, eine lokal geaenderte Datei zu
      # ueberschreiben. Eine Konfiguration, die es nur auf einer Maschine
      # gibt, ist beim naechsten Neuaufsetzen weg.
      - TELEFON_SECRET=${TELEFON_SECRET}
      - ELEVENLABS_AGENT_ID=${ELEVENLABS_AGENT_ID}
      - ELEVENLABS_TELEFON_ID=${ELEVENLABS_TELEFON_ID}
      - TELEFON_ZIEL=${TELEFON_ZIEL}
      # Telegram-Bot (eigener Alexandra-Bot). Ohne Token schlummert er.
      # SELF_URL: das Dashboard ruft seine eigene Schnellspur intern auf.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_CHAT=${TELEGRAM_ALLOWED_CHAT:-}
      - SELF_URL=http://127.0.0.1:3000
      # Melde-Kanal: Secret, mit dem Hermes-Crons proaktiv ueber die Stimme
      # abliefern duerfen (/api/melde steht vor dem Login-Gate).
      - MELDE_SECRET=${MELDE_SECRET:-}
      # ElevenLabs — Stimme fuer /sprache. Der Schluessel steht in .env und
      # muss hier durchgereicht werden: Compose gibt nur weiter, was gelistet ist.
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-eleven_flash_v2_5}
      # Was Alexandra sagt, wenn sie geweckt wird. Wird einmal erzeugt und dann
      # im Browser wiederverwendet — kurz halten, man hoert es bei jedem Wecken.
      - BEGRUESSUNG=${BEGRUESSUNG:-}
      - WAKE_WORD=${WAKE_WORD:-alexandra}
      # CRM-Datenbank (Supabase, Region Frankfurt) — RLS greift in der Datenbank
      - DATABASE_URL=${DATABASE_URL}
      # Buchhaltung (Lexware Office / lexoffice Public API) — offene Rechnungen.
      # Ohne Key schlummert die Anbindung. P3.7.
      - LEXWARE_API_KEY=${LEXWARE_API_KEY:-}
      # Meta-Ads-KPIs (Marketing API): langlebiges Token mit ads_read + Werbekonto.
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_AD_ACCOUNT_ID=${META_AD_ACCOUNT_ID:-}
      - META_API_VERSION=${META_API_VERSION:-v21.0}
    networks:
      # Ins Hermes-Netz haengen -> direkte Container-zu-Container-Verbindung,
      # Hermes ist dann als "hermes-agent-pocv-hermes-agent-1" erreichbar
      - default
      - hermes
    volumes:
      - /opt/flowstate-vorlagen:/vorlagen:ro
      # Stimmen und Dokumente fuer die Regie-Seite. Nur lesend — die Seite
      # liefert aus, sie schreibt nicht.
      - /opt/flowstate-dreh:/dreh:ro
      - /docker/hermes-agent-pocv/data/vault:/vault:ro
      # Zweites Gehirn: NUR diese Unterordner sind beschreibbar. Der Vault-Sync
      # (Host-Cron) committet + pusht sie nach Obsidian. Rest bleibt :ro, damit
      # der Dashboard-Code REGELN.md/Skills nicht anfassen kann.
      #   chronik/ = Aggregatzahlen (keine PII) · eingang/ = Kanal-Inhalte (Mail)
      - /docker/hermes-agent-pocv/data/vault/chronik:/vault/chronik:rw
      - /docker/hermes-agent-pocv/data/vault/eingang:/vault/eingang:rw
      - dashboard-data:/data
      # Gemeinsam mit der WhatsApp-Bruecke: QR-Bild + eingehende Nachrichten.
      - wa-state:/wa
      # Google-Token von Hermes mitnutzen (liegt unter .config/gws-cli).
      # rw statt ro: OAuth-Token laufen ab und muessen erneuert (zurueck-
      # geschrieben) werden. Read-only liess jeden Mailversand scheitern,
      # sobald der Token abgelaufen war ("Read-only file system: token.json").
      # Dieselbe Datei nutzt Hermes ebenfalls rw — der Token ist geteilt.
      - /docker/hermes-agent-pocv/data/.config:/gws-home/.config:rw
      # Hermes-Konfiguration NUR LESEND fuer das Modul "Agenten & Skills"
      # (Modell, Denkstaerke, Skill-Anzahl, Routinen). Secrets liegen in .env und
      # werden vom Dashboard nie gelesen.
      - /docker/hermes-agent-pocv/data/config.yaml:/hermes-data/config.yaml:ro
      - /docker/hermes-agent-pocv/data/skills:/hermes-data/skills:ro
    ports:
      # Nur lokal nuetzlich (Firewall blockt von aussen) — zum Debuggen: curl localhost:8090
      - "8090:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.flowstate.rule=Host(`flowstate.srv1044804.hstgr.cloud`)
      - traefik.http.routers.flowstate.entrypoints=websecure
      - traefik.http.routers.flowstate.tls.certresolver=letsencrypt
      - traefik.http.services.flowstate.loadbalancer.server.port=3000

  # WhatsApp-Bruecke (Baileys) — eigener Container, bewusst isoliert. Kein
  # Traefik-Label, kein veroeffentlichter Port: nur ueber das Docker-Netz
  # erreichbar. Faellt er aus, laeuft das Dashboard unbeirrt weiter.
  whatsapp:
    build: ./whatsapp-bridge
    container_name: flowstate-whatsapp
    restart: unless-stopped
    environment:
      - WA_DIR=/wa
      - WA_BRIDGE_PORT=3100
      - WA_BRIDGE_SECRET=${WA_BRIDGE_SECRET:-}
    volumes:
      - wa-state:/wa
    networks:
      - default

volumes:
  dashboard-data:
  wa-state:

networks:
  hermes:
    external: true
    name: hermes-agent-pocv_default
